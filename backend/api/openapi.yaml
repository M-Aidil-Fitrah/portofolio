openapi: 3.0.3
info:
  title: Portfolio Activity API
  version: 0.1.0
  description: |
    HTTP API for Muhammad Aidil Fitrah's portfolio activity platform.
    The contract is expanded incrementally with each backend feature.
  contact:
    name: Muhammad Aidil Fitrah
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
    description: Service health and metadata.
  - name: Admin Auth
    description: Rotating cookie-based administrator sessions.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check process health
      tags: [System]
      responses:
        "200":
          description: The API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Check dependency readiness
      tags: [System]
      responses:
        "200":
          description: The API and its dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1:
    get:
      operationId: getServiceInfo
      summary: Read API build information
      tags: [System]
      responses:
        "200":
          description: API name and build information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
  /api/v1/admin/auth/login:
    post:
      operationId: loginAdmin
      summary: Start an administrator session
      tags: [Admin Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Login succeeded and secure session cookies were set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Too many login attempts.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/admin/auth/refresh:
    post:
      operationId: refreshAdminSession
      summary: Rotate an administrator session
      tags: [Admin Auth]
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Refresh succeeded and replacement cookies were set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/admin/auth/logout:
    post:
      operationId: logoutAdmin
      summary: Revoke the current administrator session
      tags: [Admin Auth]
      security:
        - accessCookie: []
      responses:
        "204":
          description: Session revoked and cookies cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/auth/session:
    get:
      operationId: getAdminSession
      summary: Read the current administrator session
      tags: [Admin Auth]
      security:
        - accessCookie: []
      responses:
        "200":
          description: Current authenticated administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: portfolio_admin_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: portfolio_admin_refresh
  responses:
    BadRequest:
      description: The request payload is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication failed or the session is no longer valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The request origin is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: The request could not be completed due to a server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [service, status, version]
      properties:
        service:
          type: string
          example: portfolio-api
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: dev
    Readiness:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
          example: portfolio-api
        status:
          type: string
          enum: [ready, unavailable]
    ServiceInfo:
      type: object
      additionalProperties: false
      required: [commit, name, version]
      properties:
        commit:
          type: string
          example: unknown
        name:
          type: string
          example: portfolio-api
        version:
          type: string
          example: dev
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
    AdminSession:
      type: object
      additionalProperties: false
      required: [expires_at, user]
      properties:
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/AdminUser"
    AdminUser:
      type: object
      additionalProperties: false
      required: [display_name, email, id]
      properties:
        display_name:
          type: string
        email:
          type: string
          format: email
        id:
          type: string
          format: uuid
    Error:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        request_id:
          type: string
