openapi: 3.0.3
info:
  title: Portfolio Activity API
  version: 0.1.0
  description: |
    HTTP API for Muhammad Aidil Fitrah's portfolio activity platform.
    The contract is expanded incrementally with each backend feature.
  contact:
    name: Muhammad Aidil Fitrah
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
    description: Service health and metadata.
  - name: Admin Auth
    description: Rotating cookie-based administrator sessions.
  - name: Activities
    description: Public portfolio activity reads.
  - name: Admin Activities
    description: Authenticated activity management.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check process health
      tags: [System]
      responses:
        "200":
          description: The API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Check dependency readiness
      tags: [System]
      responses:
        "200":
          description: The API and its dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1:
    get:
      operationId: getServiceInfo
      summary: Read API build information
      tags: [System]
      responses:
        "200":
          description: API name and build information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
  /api/v1/admin/auth/login:
    post:
      operationId: loginAdmin
      summary: Start an administrator session
      tags: [Admin Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Login succeeded and secure session cookies were set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Too many login attempts.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/admin/auth/refresh:
    post:
      operationId: refreshAdminSession
      summary: Rotate an administrator session
      tags: [Admin Auth]
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Refresh succeeded and replacement cookies were set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/admin/auth/logout:
    post:
      operationId: logoutAdmin
      summary: Revoke the current administrator session
      tags: [Admin Auth]
      security:
        - accessCookie: []
      responses:
        "204":
          description: Session revoked and cookies cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/auth/session:
    get:
      operationId: getAdminSession
      summary: Read the current administrator session
      tags: [Admin Auth]
      security:
        - accessCookie: []
      responses:
        "200":
          description: Current authenticated administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/activities:
    get:
      operationId: listPublicActivities
      summary: List published activities
      tags: [Activities]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/ActivityCategory"
      responses:
        "200":
          description: Paginated published activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/activities/{slug}:
    get:
      operationId: getPublicActivity
      summary: Read a published activity
      tags: [Activities]
      parameters:
        - $ref: "#/components/parameters/ActivitySlug"
      responses:
        "200":
          description: Published activity detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/activities:
    get:
      operationId: listAdminActivities
      summary: List all activities
      tags: [Admin Activities]
      security:
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated activities in every status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createAdminActivity
      summary: Create an activity
      tags: [Admin Activities]
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityRequest"
      responses:
        "201":
          description: Activity created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/activities/{id}:
    get:
      operationId: getAdminActivity
      summary: Read an activity by ID
      tags: [Admin Activities]
      security:
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/ActivityID"
      responses:
        "200":
          description: Activity detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateAdminActivity
      summary: Replace an activity
      tags: [Admin Activities]
      security:
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/ActivityID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityRequest"
      responses:
        "200":
          description: Activity updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteAdminActivity
      summary: Delete an activity
      tags: [Admin Activities]
      security:
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/ActivityID"
      responses:
        "204":
          description: Activity deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    ActivityID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActivitySlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 72
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: portfolio_admin_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: portfolio_admin_refresh
  responses:
    BadRequest:
      description: The request payload is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication failed or the session is no longer valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The request origin is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: The request could not be completed due to a server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource conflicts with current server state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [service, status, version]
      properties:
        service:
          type: string
          example: portfolio-api
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: dev
    Readiness:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
          example: portfolio-api
        status:
          type: string
          enum: [ready, unavailable]
    ServiceInfo:
      type: object
      additionalProperties: false
      required: [commit, name, version]
      properties:
        commit:
          type: string
          example: unknown
        name:
          type: string
          example: portfolio-api
        version:
          type: string
          example: dev
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
    AdminSession:
      type: object
      additionalProperties: false
      required: [expires_at, user]
      properties:
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/AdminUser"
    AdminUser:
      type: object
      additionalProperties: false
      required: [display_name, email, id]
      properties:
        display_name:
          type: string
        email:
          type: string
          format: email
        id:
          type: string
          format: uuid
    ActivityCategory:
      type: string
      enum: [project, learning, daily, achievement]
    ActivityStatus:
      type: string
      enum: [published, draft, hidden]
    ActivityProgress:
      type: string
      enum: [learning, shipped, exploring]
    LocalizedText:
      type: object
      additionalProperties: false
      required: [en, id]
      properties:
        en:
          type: string
        id:
          type: string
    Activity:
      type: object
      additionalProperties: false
      required:
        - body
        - caption
        - category
        - created_at
        - date
        - id
        - pinned
        - status
        - tags
        - title
        - updated_at
        - version
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          nullable: true
          maxLength: 72
        title:
          $ref: "#/components/schemas/LocalizedText"
        caption:
          $ref: "#/components/schemas/LocalizedText"
        body:
          $ref: "#/components/schemas/LocalizedText"
        category:
          $ref: "#/components/schemas/ActivityCategory"
        date:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ActivityStatus"
        pinned:
          type: boolean
        progress:
          allOf:
            - $ref: "#/components/schemas/ActivityProgress"
          nullable: true
        related_project:
          type: string
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ActivityList:
      type: object
      additionalProperties: false
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          format: int64
    ActivityWrite:
      type: object
      additionalProperties: false
      required:
        - body
        - caption
        - category
        - date
        - pinned
        - status
        - tags
        - title
      properties:
        slug:
          type: string
          nullable: true
          maxLength: 72
        title:
          $ref: "#/components/schemas/LocalizedText"
        caption:
          $ref: "#/components/schemas/LocalizedText"
        body:
          $ref: "#/components/schemas/LocalizedText"
        category:
          $ref: "#/components/schemas/ActivityCategory"
        date:
          type: string
          format: date
        tags:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 64
        status:
          $ref: "#/components/schemas/ActivityStatus"
        pinned:
          type: boolean
        progress:
          allOf:
            - $ref: "#/components/schemas/ActivityProgress"
          nullable: true
        related_project:
          type: string
          nullable: true
          maxLength: 120
    CreateActivityRequest:
      allOf:
        - $ref: "#/components/schemas/ActivityWrite"
    UpdateActivityRequest:
      allOf:
        - $ref: "#/components/schemas/ActivityWrite"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int64
              minimum: 1
    Error:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        request_id:
          type: string
