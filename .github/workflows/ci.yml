name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio_test?sslmode=disable
      TEST_STORAGE_ENDPOINT: localhost:9000
      TEST_STORAGE_ACCESS_KEY: portfolio
      TEST_STORAGE_SECRET_KEY: portfolio-ci-storage-secret
      TEST_STORAGE_BUCKET: portfolio-test
      MAGICK_CONFIGURE_PATH: ${{ github.workspace }}/backend/config/imagemagick

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The media workers shell out to these, and the tests assert on real
      # output rather than mocks, so a missing binary must fail the job.
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            imagemagick ffmpeg libreoffice-writer libreoffice-impress \
            libreoffice-calc poppler-utils

      - name: Start object storage
        run: |
          curl -fsSL https://dl.min.io/server/minio/release/linux-amd64/minio \
            -o /usr/local/bin/minio
          chmod +x /usr/local/bin/minio
          MINIO_ROOT_USER="$TEST_STORAGE_ACCESS_KEY" \
          MINIO_ROOT_PASSWORD="$TEST_STORAGE_SECRET_KEY" \
            minio server /tmp/minio --address 127.0.0.1:9000 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Check
        working-directory: backend
        run: make check

  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: npx tsc --noEmit

      # Regenerating must be a no-op; otherwise the client and the OpenAPI
      # contract have drifted apart.
      - run: pnpm api:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # tests/e2e/stack.sh brings up its own PostgreSQL, MinIO, API, worker and
      # Next server, so only the binaries it shells out to are installed here.
      - name: Install stack dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql postgresql-contrib imagemagick ffmpeg \
            libreoffice-writer libreoffice-impress libreoffice-calc \
            poppler-utils
          curl -fsSL https://dl.min.io/server/minio/release/linux-amd64/minio \
            -o /usr/local/bin/minio
          chmod +x /usr/local/bin/minio
          # initdb and postgres are not on PATH by default, and the directory
          # is version-stamped, so resolve it instead of pinning a version.
          initdb_dir="$(dirname "$(ls -1 /usr/lib/postgresql/*/bin/initdb | tail -1)")"
          echo "$initdb_dir" >> "$GITHUB_PATH"

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
